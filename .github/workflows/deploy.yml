name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend-test/requirements.txt

      - name: Run Backend Tests
        run: pytest backend-test/test_main.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (Rolling Update)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /app
            
            echo "Pulling latest code from main..."
            git pull origin main
            
            echo "Building new Docker images..."
            docker compose build
            
            echo "Starting Rolling Release..."
            
            # Restart App 1
            echo "Updating App 1..."
            docker compose up -d --no-deps app1
            sleep 5
            
            # Restart App 2
            echo "Updating App 2..."
            docker compose up -d --no-deps app2
            sleep 5
            
            # Restart App 3
            echo "Updating App 3..."
            docker compose up -d --no-deps app3
            sleep 5
            
            # Restart Backend
            echo "Updating Backend..."
            docker compose up -d --no-deps backend
            
            # Make sure load balancer is completely up in case of updates
            docker compose up -d --no-deps load-balancer
            
            echo "Deployment Completed Successfully!"
