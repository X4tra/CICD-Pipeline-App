worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    
    # Configure Nginx DNS resolver if needed by docker, but usually automatic block works.
    
    # The app servers block is what balances traffic between your 3 apps
    upstream app_servers {
        # Mark unavailable for 5 seconds after 1 failure, routing to the next available container
        server app1:80 max_fails=1 fail_timeout=5s;
        server app2:80 max_fails=1 fail_timeout=5s;
        server app3:80 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        # Route frontend app traffic with rolling release fallbacks
        location / {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Automatically retry if container is currently restarting (during rolling update)
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        }

        # Route /api/ calls to the explicitly isolated backend server
        location /api/ {
            # Strip the /api prefix before forwarding to FastAPI so the Python code sees /hello instead of /api/hello
            rewrite ^/api/(.*)$ /$1 break;
            
            # This simply acts a secure bridge, passing the request directly to the private backend port 8000
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
